plugins {
    id 'groovy'
    id 'maven-publish'
    id 'jacoco'
    id "org.sonarqube" version "3.2.0"
    id 'net.wooga.jenkins-pipeline'
}

import com.wooga.jenkins.VersionPlugin
plugins.apply(VersionPlugin)


group = 'com.wooga'
version = '1.20.1'
description = 'Atlas Jenkins pipeline shared library'
java.sourceCompatibility = JavaVersion.VERSION_1_8

tasks.named('compileGroovy', GroovyCompile) {
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    maven {
        url = uri('https://repo.jenkins-ci.org/releases/')
    }
    maven {
        url = uri("https://repo.jenkins-ci.org/public")
    }
}

dependencies {
    implementation 'com.cloudbees:groovy-cps:1.12'
    implementation group: 'org.jenkinsci.plugins', name: 'pipeline-model-definition', version: '1.2', ext: 'jar'
    implementation 'org.codehaus.groovy:groovy-all:2.4.21'
    compileOnly group: 'io.jenkins.blueocean', name: 'blueocean-pipeline-api-impl', version: '1.27.26', ext: 'jar'
    compileOnly group: 'org.jenkins-ci.plugins', name: 'pipeline-graph-analysis',
            version: '237.v2b_75640ca_888', ext: 'jar'
    compileOnly group: 'org.jenkins-ci.plugins.workflow', name: 'workflow-api',
            version: '1413.v2ff1a_5e720fa_', ext: 'jar'
    compileOnly group: 'org.jenkins-ci.plugins.workflow', name: 'workflow-job',
            version: '1571.1580.v18e46842c125', ext: 'jar'
    compileOnly group: 'org.jenkins-ci.plugins.workflow', name: 'workflow-support',
            version: '1015.v785e5a_b_b_8b_22', ext: 'jar'
    compileOnly group: 'org.jenkins-ci.main', name: 'jenkins-core', version: '2.580.2', ext: 'jar'
    compileOnly group: 'org.kohsuke.stapler', name: 'stapler', version: '1903.1905.ve5a_f469356f0', ext: 'jar'
    compileOnly group: 'org.kohsuke.stapler', name: 'json-lib', version: '2.4-jenkins-8', ext: 'jar'
    compileOnly group: 'jakarta.servlet', name: 'jakarta.servlet-api', version: '5.0.0', ext: 'jar'
    testImplementation "org.spockframework:spock-core:1.3-groovy-2.4"
    testImplementation project(':atlas-jenkins-pipeline-test')
    testImplementation 'com.github.ben-manes.caffeine:caffeine:2.9.2'
}


jacocoTestReport {
    dependsOn test
    reports {
        xml.enabled true
    }
}

sourceSets {
    main {
        groovy {
            srcDirs = ['src/', 'vars/', 'mock/']
        }
    }
     test {
         groovy {
             srcDirs = ['test/groovy/']
         }
     }
}
